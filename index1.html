<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wheel of Misfortune — Oliver Bonas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Futura Md BT','Futura','Trebuchet MS',sans-serif;
    background:#EFEFEF;
    color:#1A1A1A;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2rem 1rem 3rem;
  }
  .header{text-align:center;margin-bottom:2rem;max-width:600px;}
  .eyebrow{font-size:13px;opacity:0.6;margin-bottom:12px;}
  h1{font-size:44px;font-weight:500;line-height:1.1;margin-bottom:10px;}
  .intro{font-size:15px;line-height:1.6;opacity:0.8;max-width:480px;margin:0 auto;}
  .canvas{position:relative;width:520px;max-width:92vw;aspect-ratio:1;margin:1rem 0 2rem;}
  .pointer{
    position:absolute;top:-10px;left:50%;
    transform:translateX(-50%);
    z-index:3;
    width:40px;height:40px;
    display:block;
  }
  .wheel{transition:transform 4.8s cubic-bezier(.17,.67,.2,1);transform-origin:50% 50%;display:block;width:100%;height:100%;}
  .hub{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:108px;height:108px;
    border-radius:50%;
    background:#1A1A1A;
    color:#EFEFEF;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    cursor:pointer;border:none;
    font-family:inherit;
    z-index:2;
    transition:transform .15s;
  }
  .hub:hover{transform:translate(-50%,-50%) scale(1.05);}
  .hub:active{transform:translate(-50%,-50%) scale(.96);}
  .hub-text{font-size:16px;font-weight:500;}
  .hub-sub{font-size:11px;opacity:0.6;margin-top:3px;}
  .result{margin:0 0 2rem;min-height:90px;max-width:560px;text-align:center;padding:0 1rem;}
  .result-label{font-size:13px;opacity:0.5;margin-bottom:8px;}
  .result-text{font-size:22px;font-weight:500;line-height:1.4;}
  .fix{
    padding:24px 32px;
    background:#1A1A1A;
    color:#EFEFEF;
    border-radius:10px;
    text-align:center;
    max-width:480px;
    width:100%;
  }
  .fix-label{font-size:12px;opacity:0.6;margin-bottom:12px;}
  .fix-keys{font-size:18px;font-weight:500;margin-bottom:10px;line-height:1.4;}
  .fix-mac{font-size:13px;opacity:0.7;}
  @media (max-width:480px){
    h1{font-size:32px;}
    .result-text{font-size:18px;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">A little game, a real point</div>
  <h1>The Wheel<br>of Misfortune.</h1>
  <p class="intro">Spin to discover what happens when you leave your computer unlocked. Eight fates, one cure.</p>
</div>

<div class="canvas">
  <div class="pointer">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <polygon points="20,36 4,4 36,4" fill="#1A1A1A" stroke="#EFEFEF" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </div>
  <svg class="wheel" id="wheel" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="arc0" d="" fill="none"/>
      <path id="arc1" d="" fill="none"/>
      <path id="arc2" d="" fill="none"/>
      <path id="arc3" d="" fill="none"/>
      <path id="arc4" d="" fill="none"/>
      <path id="arc5" d="" fill="none"/>
      <path id="arc6" d="" fill="none"/>
      <path id="arc7" d="" fill="none"/>
    </defs>
    <circle cx="260" cy="260" r="258" fill="#EFEFEF" stroke="#1A1A1A" stroke-width="1.5"/>
    <g id="segments"></g>
    <g id="labels"></g>
    <circle cx="260" cy="260" r="258" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  </svg>
  <button class="hub" id="spin" aria-label="Spin the wheel">
    <span class="hub-text">SPIN</span>
    <span class="hub-sub">tap me</span>
  </button>
</div>

<div class="result" aria-live="polite">
  <div class="result-label" id="result-label">Ready when you are</div>
  <div class="result-text" id="result-text">Press spin to discover your fate.</div>
</div>

<div class="fix">
  <div class="fix-label">Be secure</div>
  <div class="fix-keys">Lock your computer when you walk away from it.</div>
  <div class="fix-mac">Windows + L &nbsp;·&nbsp; Mac: Ctrl + Cmd + Q</div>
</div>

<script>
(function(){
  const fates = [
    {short:"Heartfelt all-staff", long:"You've just sent a heartfelt all-staff email. Subject: 'I love you all very much.' It includes a poem."},
    {short:"Teams status", long:"Your Teams status now reads 'Out of office, into the abyss.' Three people have reacted with prayer hands."},
    {short:"Email to Tolworth", long:"That deeply private email meant for one person has just landed in the inbox of every team member at Tolworth."},
    {short:"Brand betrayal", long:"You've just tweeted from the OB account: 'actually, don't like the quilted throw \u2014 kinda ugly.' It's already been screenshotted."},
    {short:"Six 7am meetings", long:"Your calendar now contains six recurring 7am meetings, all titled 'urgent strategic alignment.' One is on a Saturday."},
    {short:"Tom mid-yawn", long:"Your desktop background is now a high-resolution photograph of Tom from IT, mid-yawn. He has not consented to this."},
    {short:"Customer data", long:"A customer's details were visible to someone walking past. This one isn't a joke \u2014 it's a real data risk, and exactly why we're asking."},
    {short:"New OB store", long:"You've just signed a 10-year lease on a new OB store in a town that doesn't have a Gail's."}
  ];

  const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;

  function tick(volume){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 1200 + Math.random()*400;
    osc.type = 'square';
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
  }

  function ding(){
    if(!audioCtx) return;
    [523.25, 659.25, 783.99].forEach((freq,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      const start = audioCtx.currentTime + i*0.08;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.15, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.5);
    });
  }

  const N = fates.length;
  const segG = document.getElementById('segments');
  const labG = document.getElementById('labels');
  const svgNS = "http://www.w3.org/2000/svg";
  const cx = 260, cy = 260, R = 258;
  const dark = "#1A1A1A";
  const light = "#EFEFEF";
  const labelRadius = R * 0.72;

  const wheelSvg = document.getElementById('wheel');
  let defs = wheelSvg.querySelector('defs');
  if(!defs){
    defs = document.createElementNS(svgNS,'defs');
    wheelSvg.insertBefore(defs, wheelSvg.firstChild);
  } else {
    while(defs.firstChild) defs.removeChild(defs.firstChild);
  }

  for(let i=0;i<N;i++){
    const a0 = (i/N) * Math.PI*2 - Math.PI/2;
    const a1 = ((i+1)/N) * Math.PI*2 - Math.PI/2;
    const x0 = cx + R*Math.cos(a0);
    const y0 = cy + R*Math.sin(a0);
    const x1 = cx + R*Math.cos(a1);
    const y1 = cy + R*Math.sin(a1);
    const fill = (i%2===0) ? light : dark;
    const path = document.createElementNS(svgNS,"path");
    path.setAttribute("d",`M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1} Z`);
    path.setAttribute("fill",fill);
    path.setAttribute("stroke",dark);
    path.setAttribute("stroke-width","1");
    segG.appendChild(path);

    const mid = (a0 + a1)/2;
    const isBottom = (mid > 0 && mid < Math.PI);

    let arcStart, arcEnd, sweep;
    const arcSpan = Math.PI/N * 0.88;
    if(isBottom){
      arcStart = mid + arcSpan;
      arcEnd = mid - arcSpan;
      sweep = 0;
    } else {
      arcStart = mid - arcSpan;
      arcEnd = mid + arcSpan;
      sweep = 1;
    }

    const ax0 = cx + labelRadius*Math.cos(arcStart);
    const ay0 = cy + labelRadius*Math.sin(arcStart);
    const ax1 = cx + labelRadius*Math.cos(arcEnd);
    const ay1 = cy + labelRadius*Math.sin(arcEnd);

    const arcPath = document.createElementNS(svgNS,"path");
    arcPath.setAttribute("id", `arc${i}`);
    arcPath.setAttribute("d", `M ${ax0} ${ay0} A ${labelRadius} ${labelRadius} 0 0 ${sweep} ${ax1} ${ay1}`);
    arcPath.setAttribute("fill","none");
    defs.appendChild(arcPath);

    const txt = document.createElementNS(svgNS,"text");
    txt.setAttribute("font-family","'Futura Md BT','Futura','Trebuchet MS',sans-serif");
    txt.setAttribute("font-size","17");
    txt.setAttribute("font-weight","500");
    txt.setAttribute("fill", (i%2===0) ? dark : light);

    const tp = document.createElementNS(svgNS,"textPath");
    tp.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href",`#arc${i}`);
    tp.setAttribute("href",`#arc${i}`);
    tp.setAttribute("startOffset","50%");
    tp.setAttribute("text-anchor","middle");
    tp.textContent = fates[i].short;
    txt.appendChild(tp);
    labG.appendChild(txt);
  }

  const wheel = document.getElementById('wheel');
  const btn = document.getElementById('spin');
  const resultText = document.getElementById('result-text');
  const resultLabel = document.getElementById('result-label');
  let current = 0;
  let spinning = false;

  function scheduleTicks(durationMs){
    const baseInterval = 50;
    let t = 0;
    while(t < durationMs){
      const elapsedRatio = t / durationMs;
      const interval = baseInterval + Math.pow(elapsedRatio, 2.5) * 400;
      const vol = 0.08 * (1 - elapsedRatio*0.6);
      setTimeout(()=>tick(vol), t);
      t += interval;
    }
  }

  btn.addEventListener('click', function(){
    if(spinning) return;
    spinning = true;

    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    btn.querySelector('.hub-text').textContent = '...';
    btn.querySelector('.hub-sub').textContent = 'spinning';

    const idx = Math.floor(Math.random()*N);
    const segAngle = 360/N;
    const targetSegCentre = idx*segAngle + segAngle/2;

    const currentMod = ((current % 360) + 360) % 360;
    const desiredFinalMod = ((360 - targetSegCentre) % 360 + 360) % 360;
    let delta = desiredFinalMod - currentMod;
    if(delta <= 0) delta += 360;
    const extraTurns = 5 + Math.floor(Math.random()*3);
    const finalRot = current + delta + extraTurns*360;

    current = finalRot;
    wheel.style.transform = `rotate(${finalRot}deg)`;

    scheduleTicks(4600);

    setTimeout(function(){
      resultLabel.textContent = 'Your fate';
      resultText.textContent = fates[idx].long;
      btn.querySelector('.hub-text').textContent = 'SPIN';
      btn.querySelector('.hub-sub').textContent = 'again?';
      spinning = false;
      ding();
    }, 4800);
  });
})();
</script>
</body>
</html>
